[package]
name = "preludio"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "On-device radar nowcasting — Forecast the rain before it begins, right on your device."
license = "Apache-2.0"
repository = "https://github.com/chorust/preludio"
homepage = "https://github.com/chorust/preludio"
documentation = "https://docs.rs/preludio"
readme = "README.md"
keywords = ["radar", "nowcasting", "on-device", "weather", "wasm"]
categories = ["science", "wasm", "multimedia"]
exclude = [".git*", ".gitignore"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
native = ["dep:ort"]
cli = ["native", "dep:png", "dep:nix"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true }
png = { version = "0.17", optional = true }
nix = { version = "0.29", features = ["resource"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[[bin]]
name = "preludio"
path = "src/bin/preludio.rs"
required-features = ["cli"]
